[package]
name = "giggles-distributed"
version = "0.1.0"
edition = "2024"

[dependencies]
giggles-membership = { path = "../giggles-membership" }
giggles-core = { path = "../giggles-core" }
giggles-transactions = { path = "../giggles-transactions" }
raft = { version = "=0.7.0", default-features = false, features = ["protobuf-codec"] }
protobuf = "=2.28.0"
slog = "2"
redb = "3.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
bincode = "1.3"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
hex = "0.4"

[dev-dependencies]
rcgen = "0.13"
giggles-history = { path = "../giggles-history" }
