apiVersion: v1
kind: ConfigMap
metadata:
  name: nunya-kubernetes
  namespace: nunya
data:
  nunya.toml.template: |
    listen = "0.0.0.0:6432"
    admin_listen = "0.0.0.0:6480"
    policy = "/etc/nunya/policy.toml"
    root_key_file = "/credentials/root.key"
    state_dir = "/state"
    policy_store = "kubernetes"
    [readlog]
    sink = "stdout"
    [tls]
    cert_file = "/credentials/tls.crt"
    key_file = "/credentials/tls.key"
    [policy_store_kubernetes]
    namespace = "${POD_NAMESPACE}"
    pod_name = "${POD_NAME}"
    pod_uid = "${POD_UID}"
    management_url = "https://${POD_IP}:6481"
    lease_name = "nunya-leader"
    lease_duration_secs = 15
    renew_deadline_secs = 10
    retry_period_secs = 2
    [kubernetes.peer]
    secret_file = "/peer/secret"
    listen = "0.0.0.0:6482"
    counter_batch = 16
    [upstream]
    host = "postgres"
    user = "nunya"
    dbname = "app"
    password_file = "/credentials/password"
    tls = "verify-full"
    ca_file = "/credentials/upstream-ca.crt"
    [management]
    listen = "0.0.0.0:6481"
    [management.tls]
    cert_file = "/credentials/tls.crt"
    key_file = "/credentials/tls.key"
    [[management.admin]]
    name = "operator"
    verifier = "${ADMIN_VERIFIER}"
  # Replace with the intended bootstrap route policy before deploying.
  policy.toml: |
    version = 2
    default = "tokenize"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nunya-state
  namespace: nunya
spec:
  accessModes: [ReadWriteOnce]
  # Set storageClassName to local-path or a block CSI class; never NFS/RWX.
  # storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nunya
  namespace: nunya
spec:
  # Supported: three replicas on one node sharing one RWO PVC (see README).
  # NetworkPolicy requires a CNI that enforces it.
  replicas: 3
  # RWO permits concurrent mounts on one node. One surge pod allows rolling
  # replacement without evicting all replicas; required affinity keeps it local.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nunya
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nunya
    spec:
      serviceAccountName: nunya
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Optionally pin to the PV node; choose the actual hostname.
      # nodeSelector:
      #   kubernetes.io/hostname: state-node
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: nunya
              topologyKey: kubernetes.io/hostname
      initContainers:
        - name: render-config
          image: alpine:3.21.3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          command: [/bin/sh, -ec]
          args:
            - |
              # Only substitute the downward-API fields and SCRAM verifier.
              # printf preserves the verifier's literal dollar signs.
              while IFS= read -r line; do
                case "$line" in
                  *'${POD_NAMESPACE}'*) printf 'namespace = "%s"\n' "$POD_NAMESPACE" ;;
                  *'${POD_UID}'*) printf 'pod_uid = "%s"\n' "$POD_UID" ;;
                  *'${POD_NAME}'*) printf 'pod_name = "%s"\n' "$POD_NAME" ;;
                  *'${POD_IP}'*) printf 'management_url = "https://%s:6481"\n' "$POD_IP" ;;
                  *'${ADMIN_VERIFIER}'*) printf 'verifier = "%s"\n' "$ADMIN_VERIFIER" ;;
                  *) printf '%s\n' "$line" ;;
                esac
              done < /template/nunya.toml.template > /rendered/nunya.toml
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: ADMIN_VERIFIER
              valueFrom:
                secretKeyRef:
                  name: nunya-credentials
                  key: admin-verifier
          volumeMounts:
            - name: template
              mountPath: /template
              readOnly: true
            - name: rendered
              mountPath: /rendered
      containers:
        - name: nunya
          # Supply an image built with --features kubernetes.
          image: nunya:kubernetes
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          args: [serve, --config, /config/nunya.toml]
          env:
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            - name: postgres
              containerPort: 6432
            - name: admin
              containerPort: 6480
            - name: management
              containerPort: 6481
            - name: peer
              containerPort: 6482
          readinessProbe:
            httpGet:
              path: /ready
              port: admin
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 1
          # Gate closure affects readiness only; allow 60 seconds of health failures.
          livenessProbe:
            httpGet:
              path: /health
              port: admin
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          startupProbe:
            httpGet:
              path: /health
              port: admin
            periodSeconds: 5
            failureThreshold: 60
          volumeMounts:
            - name: template
              mountPath: /etc/nunya
              readOnly: true
            - name: rendered
              mountPath: /config
              readOnly: true
            - name: credentials
              mountPath: /credentials
              readOnly: true
            - name: peer
              mountPath: /peer
              readOnly: true
            - name: state
              mountPath: /state
      volumes:
        - name: template
          configMap:
            name: nunya-kubernetes
        - name: rendered
          emptyDir: {}
        - name: credentials
          secret:
            secretName: nunya-credentials
            defaultMode: 0440
        - name: peer
          secret:
            secretName: nunya-peer
            defaultMode: 0400
        - name: state
          persistentVolumeClaim:
            claimName: nunya-state
---
apiVersion: v1
kind: Service
metadata:
  name: nunya
  namespace: nunya
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nunya
  ports:
    - name: postgres
      port: 6432
      targetPort: postgres
