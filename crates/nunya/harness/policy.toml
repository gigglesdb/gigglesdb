snapshot_max_age_ms = 60000
[readlog]
sink = "stdout"
[domains.email]
tokenize = "on"
tokenize_limit_per_task = 20
[[column]]
table = "public.customers"
name = "email"
blind = "email"
[[column]]
table = "public.outbox"
name = "to_address"
blind = "email"
[[column]]
table = "public.customers"
name = "phone"
masked = true
placeholder = "[hidden]"
