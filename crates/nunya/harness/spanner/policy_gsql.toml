snapshot_max_age_ms = 60000
[readlog]
sink = "stdout"
[domains.email]
tokenize = "on"
tokenize_limit_per_session = 20
tokenize_limit_per_principal = 200
tokenize_principal_window = "24h"
[[column]]
table = ".Customers"
name = "Email"
blind = "email"
[[column]]
table = ".Outbox"
name = "ToAddress"
blind = "email"
[[column]]
table = ".Customers"
name = "Phone"
masked = true
placeholder = "[hidden]"
