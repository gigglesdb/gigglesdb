[package]
name = "giggles-server"
version = "0.1.0"
edition = "2024"

[dependencies]
giggles-pg-catalog = { path = "../giggles-pg-catalog" }
giggles-core = { path = "../giggles-core" }
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["unbounded_depth"] }
sha2 = "0.10"
hex = "0.4"
getrandom = "0.4"
base64 = "0.22"
bytes = "1"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "client-legacy", "http1", "http2", "service"] }
prost = "0.14"
tonic = { version = "0.14", features = ["tls-ring"] }
tonic-prost = "0.14"
tower = { version = "0.5", features = ["util"] }

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"

[dev-dependencies]
giggles-core = { path = "../giggles-core", features = ["test-sql-parser-trap"] }
prost-types = "0.14"
rcgen = "0.13"
tokio-postgres = "=0.7.15"
tokio-postgres-rustls = "0.13"
