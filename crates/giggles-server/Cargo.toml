[package]
license = "MPL-2.0"
name = "giggles-server"
version = "0.1.0"
edition = "2024"
autotests = false

[features]
legacy-task = []
default = ["engine-rocksdb", "mimalloc"]
mimalloc = ["dep:mimalloc"]
engine-rocksdb = ["giggles-core/engine-rocksdb", "giggles-language/engine-rocksdb", "dep:giggles-replication", "dep:raft", "dep:protobuf"]

[dependencies]
mimalloc = { version = "=0.1.52", optional = true, default-features = false }
giggles-replication = { path = "../giggles-replication", optional = true }
raft = { version = "=0.7.0", default-features = false, features = ["protobuf-codec"], optional = true }
protobuf = { version = "=2.28.0", optional = true }
giggles-language = { path = "../giggles-language", default-features = false }
giggles-pg-types = { path = "../giggles-pg-types" }
giggles-pg-catalog = { path = "../giggles-pg-catalog" }
giggles-core = { path = "../giggles-core", default-features = false }
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["unbounded_depth"] }
sha2 = "0.10"
hex = "0.4"
getrandom = "0.4"
base64 = "0.22"
bytes = "1"
http = "1"
http-body = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "client-legacy", "http1", "http2", "service"] }
prost = "0.14"
tonic = { version = "0.14", features = ["tls-ring"] }
tonic-prost = "0.14"
tower = { version = "0.5", features = ["util"] }

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"

[dev-dependencies]
futures-core = "0.3"
giggles-core = { path = "../giggles-core", default-features = false, features = ["test-sql-parser-trap", "test-metadata-counts"] }
giggles-faultlab = { path = "../giggles-faultlab" }
giggles-history = { path = "../giggles-history" }
prost-types = "0.14"
rcgen = "0.13"
tokio-postgres = "=0.7.15"
tokio-postgres-rustls = "0.13"

[[test]]
name = "all"
path = "tests/all.rs"

[[test]]
name = "network"
path = "tests/network.rs"

[[test]]
name = "r3_crash"
path = "tests/r3_crash.rs"
