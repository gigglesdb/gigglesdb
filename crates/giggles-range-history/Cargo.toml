[package]
name = "giggles-range-history"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
giggles-core = { path = "../giggles-core" }
giggles-distributed = { path = "../giggles-distributed" }
giggles-transactions = { path = "../giggles-transactions" }
giggles-history = { path = "../giggles-history" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.10"
rcgen = "0.13"
