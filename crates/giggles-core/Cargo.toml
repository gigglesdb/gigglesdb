[package]
license = "MPL-2.0 AND PostgreSQL AND BSD-3-Clause"
name = "giggles-core"
version = "0.1.0"
edition = "2024"
autotests = false

[features]
legacy-task = []
default = ["engine-rocksdb"]
engine-rocksdb = ["dep:rocksdb", "dep:librocksdb-sys"]
# Abrupt-crash qualification only; never enable in production binaries.
upgrade-fault-injection = []
test-commit-sync = []
# Instrumentation proving native execution avoids SQL parsing/public dispatch.
test-sql-parser-trap = []
# Scoped metadata acquisition instrumentation for protocol tests.
test-metadata-counts = []

[dependencies]
giggles-glibm-loader = { path = "../giggles-glibm-loader" }
giggles-icu = { path = "../giggles-icu" }
giggles-pg-types = { path = "../giggles-pg-types" }
giggles-transactions = { path = "../giggles-transactions" }
redb = "3.1"
rocksdb = { version = "=0.25.0", optional = true, default-features = false, features = ["lz4", "bindgen-runtime", "raw-ptr"] }
librocksdb-sys = { version = "=0.19.0+11.8.1", optional = true, default-features = false }
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
sha2 = "0.10"
getrandom = "0.3"
serde_json = { version = "1", features = ["arbitrary_precision"] }

[dev-dependencies]
giggles-model = { path = "../giggles-model" }

[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = "0.2"

[[test]]
name = "all"
path = "tests/all.rs"

[[test]]
name = "write_fence_crash"
path = "tests/write_fence_crash.rs"
required-features = ["engine-rocksdb"]

[[test]]
name = "once"
path = "tests/once.rs"

[[test]]
name = "native_once_v2_recovery"
path = "tests/native_once_v2_recovery.rs"
required-features = ["engine-rocksdb"]

[[test]]
name = "process"
path = "tests/process.rs"

[[test]]
name = "recovery"
path = "tests/recovery.rs"

[[test]]
name = "relational_process"
path = "tests/relational_process.rs"

[[test]]
name = "durable_boundaries"
path = "tests/durable_boundaries.rs"

[[test]]
name = "task_commit_crash"
path = "tests/task_commit_crash.rs"
required-features = ["engine-rocksdb"]

[[test]]
name = "upgrade_crash"
path = "tests/upgrade_crash.rs"
required-features = ["engine-rocksdb", "upgrade-fault-injection"]

[[test]]
name = "missing_icu_collation"
path = "tests/missing_icu_collation.rs"
