[package]
name = "giggles-core"
version = "0.1.0"
edition = "2024"
autotests = false

[features]
engine-rocksdb = ["dep:rocksdb"]
# Instrumentation proving native execution avoids SQL parsing/public dispatch.
test-sql-parser-trap = []

[dependencies]
giggles-pg-types = { path = "../giggles-pg-types" }
redb = "3.1"
rocksdb = { version = "=0.25.0", optional = true, default-features = false, features = ["lz4", "bindgen-runtime"] }
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
sha2 = "0.10"
getrandom = "0.3"
serde_json = { version = "1", features = ["arbitrary_precision"] }

[dev-dependencies]
giggles-model = { path = "../giggles-model" }

[[test]]
name = "all"
path = "tests/all.rs"

[[test]]
name = "accounting"
path = "tests/accounting.rs"

[[test]]
name = "once"
path = "tests/once.rs"

[[test]]
name = "process"
path = "tests/process.rs"

[[test]]
name = "recovery"
path = "tests/recovery.rs"

[[test]]
name = "relational_process"
path = "tests/relational_process.rs"
