[package]
name = "giggles-core"
version = "0.1.0"
edition = "2024"

[dependencies]
redb = "3.1"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
sha2 = "0.10"
getrandom = "0.3"
serde_json = { version = "1", features = ["arbitrary_precision"] }

[dev-dependencies]
giggles-model = { path = "../giggles-model" }
