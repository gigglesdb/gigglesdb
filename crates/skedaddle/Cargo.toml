[package]
name = "skedaddle"
version = "0.1.0"
edition = "2024"
description = "Strict migration definitions and capability reports for Skedaddle"
publish = false
exclude = ["artifacts/", "target/"]

[workspace]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
