[package]
license = "MPL-2.0"
name = "skedaddle"
version = "0.1.0"
edition = "2024"
description = "Durable coordination for the Skedaddle database migration tool"
publish = false
exclude = ["artifacts/", "target/"]

[workspace]

[profile.dev]
# Preserve unoptimized code/debug assertions, with smaller mutation-test links.
debug = 0

[features]
# Explicit opt-in for subprocess crash tests. Never reads crash controls from env.
test-crash = []

[[bin]]
name = "coordinator-fixture"
path = "src/bin/coordinator-fixture.rs"
required-features = ["test-crash"]

[dependencies]
async-trait = "0.1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
futures = "0.3"
mysql_async = { version = "=0.37.1", default-features = false, features = ["minimal-rust", "rustls-tls", "ring", "binlog"] }
mysql_common = { version = "=0.37.3", default-features = false, features = ["binlog"] }
google-cloud-spanner = { version = "=0.35.0", default-features = false, features = ["default-rustls-provider"] }
# Explicit emulator hosts need anonymous credentials without mutating process env.
google-cloud-auth = { version = "=1.19.0", default-features = false }
giggles-core = { path = "../giggles-core" }
object_store = { version = "=0.14.2", features = ["aws", "gcp", "fs"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util", "signal"] }
tokio-postgres = "=0.7.15"
postgres-protocol = "=0.6.12"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", features = ["fs"] }

