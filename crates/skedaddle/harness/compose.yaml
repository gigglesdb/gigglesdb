name: skedaddle-${RUN_ID:?run through run.ps1}
x-common: &common
  labels: {skedaddle.test: '${RUN_ID}'}
  restart: 'no'
  logging:
    driver: json-file
    options: {max-size: 2m, max-file: '2'}
  networks: [test]
x-pg-matrix: &pg-matrix
  <<: *common
  profiles: [pg-matrix]
  image: ${PG_MATRIX_IMAGE:-postgres:16-alpine}
  entrypoint: [sh, /harness/pg-start.sh]
  environment: &pg-matrix-env
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: skedaddle
    POSTGRES_DB: skedaddle
    PGDATA: /var/lib/postgresql/h1/data
    POSTGRES_INITDB_ARGS: --auth-local=trust --auth-host=scram-sha-256
    POSTGRES_HOST_AUTH_METHOD: scram-sha-256
  ports: ['127.0.0.1::5432']
  mem_limit: 384m
  shm_size: 32m
  healthcheck:
    # TCP proves the final TLS server is ready, not the initdb socket server.
    test: [CMD-SHELL, 'PGPASSWORD=skedaddle psql "host=127.0.0.1 user=postgres dbname=skedaddle sslmode=verify-full sslrootcert=/var/lib/postgresql/h1/tls/ca.pem" -Atqc "SELECT 1"']
    interval: 2s
    timeout: 3s
    retries: 60
services:
  spanner-emulator:
    <<: *common
    profiles: [spanner-emulator]
    image: gcr.io/cloud-spanner-emulator/emulator@sha256:f9212d99a52ee9bf39b6e4b397eab09b90d87327dca7a985110801456b40dc9d
    platform: linux/amd64
    ports: ['127.0.0.1::9010', '127.0.0.1::9020']
    # In-memory database; no persistent volumes. Bound the whole service below 1 GiB.
    mem_limit: 768m
    shm_size: 16m
  # Anchor the MySQL settings here so inactive profiles leave PG config unchanged.
  mysql80: &mysql-matrix
    <<: *common
    entrypoint: [bash, /harness/mysql-start.sh]
    environment:
      MYSQL_ROOT_PASSWORD: skedaddle
      MYSQL_ROOT_HOST: '%'
      HARNESS_MYSQL_GTID: ${MYSQL_GTID_MODE:-ON}
    ports: ['127.0.0.1::3306']
    mem_limit: 640m
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD=skedaddle mysql --host=127.0.0.1 --user=root --ssl-mode=VERIFY_CA --ssl-ca=/var/lib/mysql/harness/tls/ca.pem -Nse "SELECT 1"']
      interval: 2s
      timeout: 5s
      retries: 90
    profiles: [mysql80]
    image: ${MYSQL80_IMAGE:-mysql:8.0@sha256:7dcddc01f13bab2f15cde676d44d01f61fc9f99fe7785e86196dfc07d358ae2b}
    volumes:
      - mysql80data:/var/lib/mysql
      - ./mysql-start.sh:/harness/mysql-start.sh:ro
      - ./mysql-init.sql:/docker-entrypoint-initdb.d/10-m1.sql:ro
  mysql84:
    <<: *mysql-matrix
    profiles: [mysql84]
    image: ${MYSQL84_IMAGE:-mysql:8.4@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902}
    volumes:
      - mysql84data:/var/lib/mysql
      - ./mysql-start.sh:/harness/mysql-start.sh:ro
      - ./mysql-init.sql:/docker-entrypoint-initdb.d/10-m1.sql:ro
  pg-source:
    <<: *pg-matrix
    volumes:
      - pgsource:/var/lib/postgresql
      - ./pg-start.sh:/harness/pg-start.sh:ro
      - ./pg-init.sql:/docker-entrypoint-initdb.d/10-h1-roles.sql:ro
  pg-destination:
    <<: *pg-matrix
    volumes:
      - pgdestination:/var/lib/postgresql
      - ./pg-start.sh:/harness/pg-start.sh:ro
      - ./pg-init.sql:/docker-entrypoint-initdb.d/10-h1-roles.sql:ro
  # A separate negative-control server; source and destination stay logical.
  pg-replica-wal:
    <<: *pg-matrix
    environment:
      <<: *pg-matrix-env
      HARNESS_WAL_LEVEL: replica
    volumes:
      - pgreplica:/var/lib/postgresql
      - ./pg-start.sh:/harness/pg-start.sh:ro
      - ./pg-init.sql:/docker-entrypoint-initdb.d/10-h1-roles.sql:ro
  pg:
    <<: *common
    image: ${PG_IMAGE}
    environment: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: skedaddle, POSTGRES_DB: skedaddle}
    command: [postgres, -c, max_wal_size=128MB, -c, min_wal_size=32MB, -c, logging_collector=off]
    volumes: [pgdata:/var/lib/postgresql]
    ports: ['127.0.0.1::5432']
    mem_limit: 512m
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d skedaddle]
      interval: 2s
      timeout: 3s
      retries: 40
  minio:
    <<: *common
    image: ${MINIO_IMAGE}
    command: [server, /data, --console-address, ':9001']
    environment: {MINIO_ROOT_USER: skedaddle, MINIO_ROOT_PASSWORD: skedaddle-secret}
    volumes: [miniodata:/data]
    ports: ['127.0.0.1::9000']
    mem_limit: 512m
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:9000/minio/health/live]
      interval: 2s
      timeout: 3s
      retries: 40
  gcs:
    <<: *common
    image: ${GCS_IMAGE}
    command: [-scheme, http, -port, '4443', -backend, filesystem, -filesystem-root, /storage]
    volumes: [gcsdata:/storage]
    ports: ['127.0.0.1::4443']
    # JSON media uploads materialize request bodies; allow the P3 100 MB case.
    mem_limit: 768m
    healthcheck:
      test: [CMD-SHELL, wget -q -O - http://127.0.0.1:4443/storage/v1/b]
      interval: 2s
      timeout: 3s
      retries: 40
  toxiproxy:
    <<: *common
    image: ${TOXIPROXY_IMAGE}
    ports: ['127.0.0.1::8474', '127.0.0.1::9002', '127.0.0.1::9003', '127.0.0.1::9004']
    mem_limit: 64m
    healthcheck:
      test: [CMD, /toxiproxy-cli, -host, 'http://127.0.0.1:8474', list]
      interval: 2s
      timeout: 3s
      retries: 30
  faults:
    <<: *common
    image: ${FAULTS_IMAGE}
    command:
      - sh
      - -c
      - >-
        trap 'exit 0' INT TERM;
        while true; do
          printf 'HTTP/1.1 503 Service Unavailable\r\nContent-Length: 0\r\nConnection: close\r\n\r\n' | nc -l -p 8080 >/dev/null;
        done
    mem_limit: 32m
    read_only: true
    healthcheck:
      test: [CMD, 'true']
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  # Two 480 MiB caps, including data, redo, binlogs and private TLS keys.
  mysql80data:
    labels: {skedaddle.test: '${RUN_ID}'}
    driver_opts: {type: tmpfs, device: tmpfs, o: 'size=480m,mode=0700'}
  mysql84data:
    labels: {skedaddle.test: '${RUN_ID}'}
    driver_opts: {type: tmpfs, device: tmpfs, o: 'size=480m,mode=0700'}
  # Hard aggregate cap: three 256 MiB volumes = 768 MiB, including WAL/TLS.
  pgsource:
    labels: {skedaddle.test: '${RUN_ID}'}
    driver_opts: {type: tmpfs, device: tmpfs, o: 'size=256m,mode=0700'}
  pgdestination:
    labels: {skedaddle.test: '${RUN_ID}'}
    driver_opts: {type: tmpfs, device: tmpfs, o: 'size=256m,mode=0700'}
  pgreplica:
    labels: {skedaddle.test: '${RUN_ID}'}
    driver_opts: {type: tmpfs, device: tmpfs, o: 'size=256m,mode=0700'}
  pgdata: {labels: {skedaddle.test: '${RUN_ID}'}}
  miniodata: {labels: {skedaddle.test: '${RUN_ID}'}}
  gcsdata: {labels: {skedaddle.test: '${RUN_ID}'}}
networks:
  test: {labels: {skedaddle.test: '${RUN_ID}'}}
