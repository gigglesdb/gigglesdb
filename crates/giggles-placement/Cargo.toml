[package]
name = "giggles-placement"
version = "0.1.0"
edition = "2024"

[dependencies]
giggles-topology = { path = "../giggles-topology" }
giggles-distributed = { path = "../giggles-distributed" }
giggles-membership = { path = "../giggles-membership" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
sha2 = "0.10"
hex = "0.4"
redb = "3.1"

[dev-dependencies]
giggles-core = { path = "../giggles-core" }
giggles-transactions = { path = "../giggles-transactions" }
rcgen = "0.13"
