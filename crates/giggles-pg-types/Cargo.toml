[package]
name = "giggles-pg-types"
version = "0.1.0"
edition = "2024"
autotests = false
license = "MPL-2.0 AND PostgreSQL AND BSL-1.0"

[workspace]

[dependencies]
chrono = { version = "=0.4.42", default-features = false, features = ["std"] }
chrono-tz = "=0.10.4"
tz-rs = { version = "=0.7.3", default-features = false, features = ["alloc"] }
num-bigint = "0.4.6"
num-traits = "0.2.19"

[dev-dependencies]
proptest = "1.9"

[[test]]
name = "all"
path = "tests/all.rs"
