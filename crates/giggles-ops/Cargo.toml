[package]
license = "MPL-2.0"
name = "giggles-ops"
version = "0.1.0"
edition = "2024"
default-run = "giggles-ops"

[workspace]

[dependencies]
giggles-core = { path = "../giggles-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
getrandom = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
giggles-core = { path = "../giggles-core", features = ["legacy-task"] }
