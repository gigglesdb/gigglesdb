[package]
license = "MPL-2.0"
name = "giggles-replication"
version = "0.1.0"
edition = "2024"
autotests = false

[dependencies]
giggles-core = { path = "../giggles-core" }
raft = { version = "=0.7.0", default-features = false, features = ["protobuf-codec"] }
protobuf = "=2.28.0"
slog = "2"
redb = "3.1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
hex = "0.4"

[dev-dependencies]
giggles-history = { path = "../giggles-history" }
rocksdb = { version = "=0.25.0", default-features = false, features = ["lz4", "bindgen-runtime"] }
rcgen = "0.13"

[[test]]
name = "all"
path = "tests/all.rs"
