[package]
name = "giggles-language"
version = "0.1.0"
edition = "2024"
autotests = false

[dependencies]
giggles-core = { path = "../giggles-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
giggles-core = { path = "../giggles-core", features = ["test-sql-parser-trap"] }

[[test]]
name = "all"
path = "tests/all.rs"

[[test]]
name = "cli"
path = "tests/cli.rs"
