[package]
name = "giggles-engine-bench"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[features]
default = []
rocksdb = ["dep:rocksdb"]

[dependencies]
redb = "3.1"
fjall = "=3.1.13"
rocksdb = { version = "=0.25.0", optional = true, default-features = false, features = ["lz4", "bindgen-runtime"] }
hdrhistogram = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fastrand = "2"
memory-stats = "1"
clap = { version = "4", features = ["derive"] }
