[package]
license = "MPL-2.0"
name = "r0-tokio-probe"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
tokio = { version = "=1.47.1", features = ["macros", "rt-multi-thread", "time"] }
tokio-postgres = { version = "=0.7.15", features = ["with-chrono-0_4", "with-uuid-1"] }
postgres-types = { version = "=0.2.11", features = ["with-chrono-0_4", "with-uuid-1"] }
serde_json = "=1.0.145"
base64 = "=0.22.1"
bytes = "=1.10.1"
chrono = "=0.4.42"
uuid = "=1.18.1"
rust_decimal = { version = "=1.39.0", features = ["db-tokio-postgres"] }
