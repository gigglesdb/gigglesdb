name: Nunya image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Optional extra image tag (for example, 0.1.0)
        type: string
        required: false
      push:
        description: Push the image to GHCR (false builds and tests locally)
        type: boolean
        default: true

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    timeout-minutes: 60
    concurrency:
      group: nunya-image
      cancel-in-progress: false
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Prepare image references
        id: image
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
          EXTRA_TAG: ${{ inputs.tag }}
        run: |
          if [[ -n "$EXTRA_TAG" && ! "$EXTRA_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo 'The extra tag must be a valid Docker tag.' >&2
            exit 1
          fi
          image="ghcr.io/${OWNER,,}/nunya"
          sha_tag="sha-${GITHUB_SHA:0:7}"
          printf 'name=%s\nsha_tag=%s\nreference=%s:%s\nextra_tag=%s\n' \
            "$image" "$sha_tag" "$image" "$sha_tag" "$EXTRA_TAG" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ inputs.push }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.image.outputs.sha_tag }},priority=1000
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.image.outputs.extra_tag }},enable=${{ inputs.tag != '' }}
          labels: |
            org.opencontainers.image.title=nunya
            org.opencontainers.image.description=Tokenizing database gateway for agents to use protected data without seeing it

      - name: Build image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: crates/nunya/Dockerfile
          platforms: linux/amd64
          push: ${{ inputs.push }}
          load: ${{ !inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=nunya
          cache-to: type=gha,mode=max,scope=nunya

      - name: Smoke test image
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.reference }}
          PUSH: ${{ inputs.push }}
        run: |
          if [[ "$PUSH" == true ]]; then
            docker pull "$IMAGE"
          fi
          docker run --rm "$IMAGE" --help

      - name: Image summary
        env:
          IMAGE: ${{ steps.image.outputs.reference }}
          DIGEST: ${{ steps.build.outputs.digest }}
          PUSH: ${{ inputs.push }}
        shell: bash
        run: |
          printf 'Image: `%s`\n\nDigest: `%s`\n\nPushed: `%s`\n' \
            "$IMAGE" "$DIGEST" "$PUSH" >> "$GITHUB_STEP_SUMMARY"
